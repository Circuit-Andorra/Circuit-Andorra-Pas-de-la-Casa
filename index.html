      ["1. Objet", "Les présentes conditions régissent la participation aux activités du Circuit Andorra Pas de la Casa (stages de pilotage, expériences, karting et sessions sur piste). Pour y participer, il faut les accepter, ainsi que le document de décharge de responsabilité et d'assurance."],
      ["2. Conditions requises", "Les activités de conduite automobile exigent d'avoir 18 ans révolus et un permis de conduire en cours de validité. Les mineurs ne peuvent participer qu'aux activités qui le permettent (par exemple le karting), et toujours avec l'autorisation et la signature du père, de la mère ou du tuteur légal, qui en assume la responsabilité. Le personnel du circuit peut demander la pièce d'identité et le permis de conduire."],
      ["3. Santé, alcool et drogues", "Il faut être en bonne santé. Il est interdit de conduire avec la moindre quantité d'alcool (0,0) ou sous l'effet de drogues, de médicaments ou d'autres substances qui réduisent la capacité de conduite. L'instructeur peut exclure de l'activité toute personne qui ne respecte pas ces conditions, sans aucun remboursement."],
      ["4. Sécurité", "Il est obligatoire d'utiliser l'équipement de sécurité fourni par le circuit (comme le casque) et de suivre à tout moment les instructions du personnel. Une utilisation inadaptée ou imprudente du véhicule entraîne l'exclusion de l'activité, sans remboursement."],
      ["5. Assurance", "Chaque participant doit être couvert par une assurance accidents, conformément au document de décharge de responsabilité. Les garanties de l'assurance du circuit figurent sur le certificat d'assurance, à la disposition du participant à l'accueil. Tout accident ou blessure doit être signalé au personnel du circuit immédiatement et, au plus tard, dans un délai de 24 heures."],
      ["6. Dommages matériels", "Le conducteur est financièrement responsable des dommages qu'il cause aux véhicules (karts, motos, voitures) et aux installations du circuit, et doit les régler avant de quitter le circuit le jour même."],
      ["7. Annulations", "Conditions d'annulation, pour toutes les activités :\n- Annulation avant le 1er novembre : pénalité de 30 %.\n- Du 1er au 30 novembre : pénalité de 75 %.\n- À partir du 1er décembre : pénalité de 100 %.\n- Absence le jour de l'activité : le montant n'est pas remboursé."],
      ["8. Mauvais temps", "En cas de mauvais temps ou de fermeture du Port d'Envalira, nous cherchons un autre horaire ou une autre date, cette saison ou la suivante, mais le montant payé n'est pas remboursé."],
      ["9. Image", "Dans le formulaire, le participant décide s'il autorise ou non le Circuit Andorra à utiliser les photos et vidéos prises pendant l'activité pour sa promotion (site web et réseaux sociaux). Il peut retirer cette autorisation à tout moment en écrivant à info@circuit-andorra.com. Les installations du circuit sont placées sous vidéosurveillance pour des raisons de sécurité."],
      ["10. Protection des données", "Responsable du traitement : ESPONSORAMA SL (Circuit Andorra Pas de la Casa), NRT L-710401-T, Av. Príncep Benlloch 95, AD500 Andorra la Vella, info@circuit-andorra.com. Finalité : gérer l'inscription et l'activité, l'assurance accidents et les obligations légales et, uniquement si le participant l'accepte, lui envoyer des informations sur les activités du circuit. Les données sont conservées tant qu'elles sont nécessaires à ces finalités et pendant les délais légaux. Elles sont stockées dans les services cloud de Google et ne sont communiquées à l'assureur qu'en cas d'accident ou lorsque la loi l'exige. Le participant peut exercer ses droits d'accès, de rectification, d'effacement, d'opposition, de limitation et de portabilité en écrivant à info@circuit-andorra.com, et déposer une réclamation auprès de l'Agence andorrane de protection des données. Réglementation : loi 29/2021, du 28 octobre, qualifiée de protection des données personnelles."],
      ["11. Droit applicable", "Les présentes conditions sont régies par le droit andorran. Pour tout litige, les parties se soumettent aux tribunaux de la Principauté d'Andorre."]
    ]
  },
  descarrec: {
    titol: "Décharge de responsabilité et assurance",
    clausules: [
      "PREMIÈREMENT.- Le pilote inscrit déclare se soumettre au règlement de l'entraînement / épreuve, événement, stage de pilotage ou session de karts ou de motos, ainsi qu'aux règles de l'installation dans leur contenu et leur forme, et s'engage à suivre à tout moment les instructions du personnel de sécurité et d'organisation pendant son déroulement.",
      "DEUXIÈMEMENT.- Il est obligatoire d'être titulaire d'une assurance personnelle couvrant les risques liés à cette activité. Les licences fédérales en cours de validité sont acceptées, sur présentation de celles-ci lors de la remise de ce disclaimer. En moto, seules sont acceptées les licences régionales valides, nationales ou régionales homologuées. En automobile, les licences ne seront acceptées qu'en cas de compétition officielle, à condition que l'assurance de l'épreuve le prévoie. D'autres types d'assurance pourront être acceptés, à condition de présenter la police ou le certificat d'assurance en vigueur précisant que les risques liés à cette activité sont couverts et que les garanties minimales prévues par la police correspondent aux garanties minimales exigées par le circuit.",
      "TROISIÈMEMENT.- Les usagers qui ne disposent ni d'une licence fédérale ni d'aucun autre type d'assurance couvrant les risques liés à cette activité devront souscrire cette assurance accidents obligatoire. Les garanties sont précisées dans le certificat d'assurance mis à leur disposition. L'usager qui souscrit cette assurance connaît et accepte les conditions de la police souscrite par le circuit.",
      "QUATRIÈMEMENT.- Le soussigné, ses héritiers et autres représentants légaux dégagent les organisateurs de toute responsabilité civile ou pénale découlant de sa participation à cet entraînement / épreuve, événement, stage de pilotage ou session de karts ou de motos, ainsi que des éventuels risques et dommages, de quelque nature que ce soit, non couverts par les polices d'assurance souscrites, en renonçant expressément à toute réclamation pour dommages et préjudices contre l'organisateur, le circuit ou toute personne participant à l'organisation de l'entraînement / épreuve, événement, stage de pilotage ou session de karts ou de motos.",
      "CINQUIÈMEMENT.- En cas d'accident, l'inscrit devra le signaler, ainsi que les dommages ou blessures provoqués, dans un délai maximal de 24 heures. Passé ce délai, le circuit n'en sera pas responsable.",
      "SIXIÈMEMENT.- Le soussigné s'engage à empêcher l'utilisation du véhicule par des tiers sans la connaissance préalable et l'autorisation expresse de l'organisateur.",
      "SEPTIÈMEMENT.- L'organisateur avertit qu'il relève de la responsabilité exclusive du pilote d'utiliser tous les équipements de sécurité personnelle, en parfait état et dûment homologués, exigés par les fédérations sportives correspondantes pour participer à des épreuves officielles, en particulier le casque, les gants, la combinaison, le HANS, les bottes, la minerve et tout autre élément.",
      "HUITIÈMEMENT.- Le pilote déclare connaître les RÈGLES MINIMALES DE SÉCURITÉ OBLIGATOIRES, qui lui ont été expressément communiquées, telles que : ne pas sortir de son véhicule ni marcher sur la piste ; en cas de panne ou d'accident, garer le véhicule hors de la trajectoire (si possible par ses propres moyens ou sans sortir du véhicule) et se mettre à la disposition du personnel de l'organisation ; ne pas traverser à pied la ligne de fin de Pit Lane, ni le pilote ni aucun de ses accompagnateurs ; aucune personne non autorisée par l'organisateur ne doit se trouver dans le Pit Lane, et en aucun cas les mineurs de moins de 16 ans (sauf pilotes) ni les animaux de compagnie ; ne jamais circuler, en aucune circonstance, en sens inverse ; en cas de drapeau jaune, réduire la vitesse en raison de la présence possible d'obstacles et/ou de personnes sur la piste, redoubler de prudence et quitter la piste par les sorties, les dépassements étant interdits ; ne pas utiliser, où que ce soit dans les installations, d'équipement produisant des étincelles (par exemple du matériel de soudure) ni présentant tout autre risque d'incendie ; il est strictement interdit de circuler dans le Paddock avec des véhicules non immatriculés ou non assurés, ainsi qu'à vélo ou en trottinette (motorisée ou non) ; il est interdit de fumer dans les zones des stands, du Pit Lane et de la piste.",
      "NEUVIÈMEMENT.- L'organisateur de l'épreuve, du stage ou de la session avertit, pour le bien du pilote lui-même et de toutes les personnes concernées, qu'il est opposé à la consommation, y compris dans les heures précédant le début de l'épreuve, de stimulants, médicaments, boissons ou toute autre substance pouvant altérer le comportement du pilote (ou de l'accompagnateur) ou diminuer ses facultés de conduite. En cas de prise de telles substances, il devra s'abstenir d'utiliser le véhicule lors de cette épreuve. La conduite d'un véhicule, dans les conditions décrites ou dans des circonstances physiques et psychiques parfaitement normales, est en soi une activité à risque qui peut provoquer, en cas d'accident causé par le pilote ou par d'autres pilotes, des blessures graves, voire la mort.",
      "DIXIÈMEMENT.- Clause de dommages aux installations : toutes les personnes signataires du présent document qui causent des dommages à une partie quelconque de l'installation, qu'il s'agisse de clôtures, glissières de sécurité, barrières, stands, mobilier ou tout autre élément, en seront financièrement responsables et devront les régler avant de quitter le circuit le jour même. Si la personne signataire n'en assume pas la responsabilité, l'organisateur de l'événement, le cas échéant, devra l'assumer.",
      "ONZIÈMEMENT.- Clause de nettoyage : tous les espaces de l'installation, tels que les stands, le pit-lane, les étages des stands, les salons VIP, le paddock, etc., doivent être laissés propres, dans l'état où ils ont été trouvés à l'arrivée. Si, à la fin, il reste des traces de lubrifiants ou de carburants, ou si des pièces ou des déchets de véhicules sont laissés, la personne responsable du stand ou, à défaut, l'organisateur prendra en charge le coût du nettoyage ou de la gestion des déchets.",
      "DOUZIÈMEMENT.- Clause de vol de matériel de l'installation : tout matériel qui disparaît des stands ou de l'installation en général relève de la responsabilité de l'occupant de l'espace utilisé ou de l'organisateur de l'événement.",
      "TREIZIÈMEMENT.- Vidéosurveillance et visionnage des images : l'ensemble de l'installation est placé sous vidéosurveillance et, si nécessaire, les images seront visionnées pour identifier la personne responsable de tout acte.",
      "QUATORZIÈMEMENT.- Liste de prix : Circuit Andorra dispose d'une liste de prix de tout le matériel et des coûts d'entretien, de réparation et de nettoyage. Cette liste peut être demandée pour consultation chaque fois que nécessaire.",
      "QUINZIÈMEMENT.- Le soussigné est donc pleinement conscient des risques et des conséquences possibles liés à sa participation à cette activité, et les assume en tout état de cause de manière volontaire. Une utilisation inadaptée ou imprudente du véhicule, selon l'appréciation de l'organisateur, entraînera l'exclusion de l'épreuve, sans que cela donne lieu au remboursement des frais d'inscription.",
      "SEIZIÈMEMENT.- L'objectif de cette activité est d'améliorer la sécurité au volant, en s'entraînant sur circuit fermé, sans les aléas de la circulation routière et dans des conditions de sécurité contrôlées. L'organisateur interdit formellement l'organisation de courses ou de compétitions dans le cadre de cette épreuve. Le non-respect de cette règle est un motif suffisant d'exclusion de l'épreuve.",
      "DIX-SEPTIÈMEMENT.- Clause de dommages aux véhicules (karts, motos) : toutes les personnes signataires du présent document qui causent des dommages à un véhicule (karts, motos), aux glissières de sécurité, barrières, stands, mobilier ou tout autre élément, en seront financièrement responsables et devront les régler avant de quitter le circuit le jour même."
    ],
    final: "Conformément aux termes décrits, le pilote et, s'il est mineur, son père, sa mère ou son tuteur légal signent le présent document."
  }

en: {
  condicions: {
    titol: "Terms of participation",
    seccions: [
      ["1. Purpose", "These terms govern participation in the activities of Circuit Andorra Pas de la Casa (driving courses, experiences, karting and track sessions). To take part, you must accept them, together with the liability waiver and insurance document."],
      ["2. Requirements", "Car driving activities require you to be at least 18 years old and to hold a valid driving licence. Minors may only take part in activities that allow it (for example, karting), and always with the authorisation and signature of their father, mother or legal guardian, who takes responsibility for them. Circuit staff may ask to see your ID and driving licence."],
      ["3. Health, alcohol and drugs", "You must be in good health. Driving with any amount of alcohol (0.0) or under the influence of drugs, medication or other substances that reduce driving ability is forbidden. The instructor may exclude from the activity anyone who does not meet these requirements, with no refund."],
      ["4. Safety", "You must use the safety equipment provided by the circuit (such as the helmet) and follow the staff's instructions at all times. Inappropriate or reckless use of the vehicle will lead to exclusion from the activity, with no refund."],
      ["5. Insurance", "Every participant must be covered by accident insurance, as set out in the liability waiver. The cover provided by the circuit's insurance is stated in the insurance certificate, available to participants at reception. Any accident or injury must be reported to circuit staff immediately and, at the latest, within 24 hours."],
      ["6. Material damage", "The driver is financially responsible for any damage they cause to vehicles (karts, motorbikes, cars) and to the circuit's facilities, and must pay for it before leaving the circuit on the same day."],
      ["7. Cancellations", "Cancellation terms, for all activities:\n- Cancellation before 1 November: 30% penalty.\n- From 1 to 30 November: 75% penalty.\n- From 1 December: 100% penalty.\n- No-show on the day of the activity: the amount is not refunded."],
      ["8. Bad weather", "In case of bad weather or closure of the Port d'Envalira pass, we will find another time or date, this season or the next, but the amount paid is not refunded."],
      ["9. Images", "In the form, the participant decides whether or not to authorise Circuit Andorra to use photos and videos taken during the activity for promotion (website and social media). This authorisation can be withdrawn at any time by writing to info@circuit-andorra.com. The circuit's facilities are monitored by CCTV for safety reasons."],
      ["10. Data protection", "Data controller: ESPONSORAMA SL (Circuit Andorra Pas de la Casa), NRT L-710401-T, Av. Príncep Benlloch 95, AD500 Andorra la Vella, info@circuit-andorra.com. Purpose: to manage the registration and the activity, the accident insurance and legal obligations and, only if the participant agrees, to send information about the circuit's activities. Data are kept for as long as needed for these purposes and for the legal retention periods. They are stored on Google cloud services and are only disclosed to the insurer in the event of an accident or when required by law. Participants may exercise their rights of access, rectification, erasure, objection, restriction and portability by writing to info@circuit-andorra.com, and may lodge a complaint with the Andorran Data Protection Agency. Legislation: Law 29/2021 of 28 October on the protection of personal data."],
      ["11. Governing law", "These terms are governed by Andorran law. Any dispute shall be submitted to the courts of the Principality of Andorra."]
    ]
  },
  descarrec: {
    titol: "Liability waiver and insurance",
    clausules: [
      "FIRST.- The registered driver declares that they submit to the rules of the training session / event, driving course or kart or motorcycle session, as well as to the rules of the facility in their content and form, and undertakes at all times to follow the instructions of the safety and organising staff while it takes place.",
      "SECOND.- It is compulsory to hold personal insurance covering the risks arising from this activity. Valid federation licences are accepted, provided they are shown when this disclaimer is handed in. In motorcycling, only valid regional licences, or approved national or regional licences, are accepted. In motor racing, licences will only be accepted for official competitions, provided the event's insurance allows for it. Other types of insurance may be accepted provided that the valid policy or insurance certificate is presented, stating that the risks arising from this activity are covered and that the minimum cover in the policy matches the minimum cover required by the circuit.",
      "THIRD.- Users who have neither a federation licence nor any other type of insurance covering the risks arising from this activity must take out this compulsory accident insurance. The cover is specified in the insurance certificate available to them. Users who take out this insurance know and accept the terms of the policy taken out by the circuit.",
      "FOURTH.- The undersigned, their heirs and other legal representatives release the organisers from all civil or criminal liability arising from their participation in this training session / event, driving course or kart or motorcycle session, as well as from any risks and damage of any kind not covered by the insurance policies taken out, expressly waiving any claim for damages against the organiser, the circuit or any of the persons involved in organising the training session / event, driving course or kart or motorcycle session.",
      "FIFTH.- In the event of an accident, the registered participant must report it, as well as any damage or injuries caused, within a maximum of 24 hours. After that time, the circuit will not be liable for them.",
      "SIXTH.- The undersigned undertakes to prevent the vehicle from being used by third parties without the prior knowledge and express authorisation of the organiser.",
      "SEVENTH.- The organiser warns that it is the driver's sole responsibility to use all personal safety equipment, in perfect condition and duly approved, required by the relevant sports federations to take part in official events, in particular the helmet, gloves, race suit, HANS device, boots, neck brace and any other item.",
      "EIGHTH.- The driver declares that they know the MANDATORY MINIMUM SAFETY RULES, which have been expressly communicated to them, such as: do not get out of the vehicle or walk onto the track; in the event of a breakdown or accident, park the vehicle off the racing line (if possible under its own power or without getting out of the vehicle) and follow the instructions of the organising staff; neither the driver nor any companion may cross the Pit Lane exit line on foot; no persons not authorised by the organiser may be in the Pit Lane, and under no circumstances children under 16 (except drivers) or pets; never drive in the opposite direction under any circumstances; when the yellow flag is shown, reduce speed due to the possible presence of obstacles and/or people on the track, take extreme care and leave the track through the exits, and overtaking is forbidden; do not use any equipment that produces sparks (for example, welding equipment) or any other fire risk anywhere in the facilities; driving in the Paddock with unregistered or uninsured vehicles, or with bicycles or scooters (motorised or not), is strictly forbidden; smoking is forbidden in the pit garages, Pit Lane and track.",
      "NINTH.- The organiser of the event, course or session warns, for the good of the driver and of everyone involved, against the consumption, even hours before the start of the event, of stimulants, medication, drinks or any other substance that may alter the behaviour of the driver (or passenger) or reduce their ability to drive the vehicle. If such substances have been taken, the driver must refrain from using the vehicle in this event. Driving a vehicle, in the conditions described or in fully normal physical and mental circumstances, is in itself a risky activity which may cause, in the event of an accident caused by the driver or by other drivers, serious injury and even death.",
      "TENTH.- Damage to the facilities: all persons signing this document who cause damage to any part of the facilities, whether fences, guardrails, barriers, pit garages, furniture or any other item, will be financially responsible for that damage and must settle it before leaving the circuit on the same day. If the signatory does not take responsibility, the event organiser, if any, must assume it.",
      "ELEVENTH.- Cleaning: all areas of the facilities, such as pit garages, pit lane, garage floors, VIP rooms, paddock, etc., must be left as clean as they were found on arrival. If, at the end, there are remains of lubricants or fuel, or vehicle parts or waste are left behind, the person responsible for the garage or, failing that, the organiser will bear the cost of cleaning or waste management.",
      "TWELFTH.- Theft of the facility's equipment: any equipment that goes missing from the pit garages or from the facilities in general will be the responsibility of the occupant of the area in use or of the event organiser.",
      "THIRTEENTH.- CCTV and review of images: the entire facility is monitored by CCTV and, if necessary, the images will be reviewed to identify the person responsible for any act.",
      "FOURTEENTH.- Price list: Circuit Andorra has a price list for all equipment and for maintenance, repair and cleaning costs. This list may be requested for consultation whenever necessary.",
      "FIFTEENTH.- The undersigned is therefore fully aware of the risks and possible consequences arising from their participation in this activity, and voluntarily accepts them in all cases. Inappropriate or reckless use of the vehicle, in the organiser's judgement, will lead to exclusion from the event, without any refund of the registration fee.",
      "SIXTEENTH.- The aim of this activity is to improve driving safety by practising on a closed circuit, free from the adverse conditions of road traffic and under controlled safety conditions. The organiser strictly forbids holding races or competitions within this event. Failure to comply with this rule is sufficient grounds for exclusion from the event.",
      "SEVENTEENTH.- Damage to vehicles (karts, motorbikes): all persons signing this document who cause damage to any vehicle (karts, motorbikes), guardrails, barriers, pit garages, furniture or any other item will be financially responsible for that damage and must settle it before leaving the circuit on the same day."
    ],
    final: "In accordance with the terms described, the driver and, if a minor, their father, mother or legal guardian sign this document."
  }
}
};
</script>

<style>
  :root {
    --fons: #0b1620; --fons2: #13222f; --linia: #24384a; --text: #f2f6f9; --suau: #9fb3c4;
    --blau: #00a0e3; --blau2: #0086c0; --error: #ff6b6b; --ok: #3ecf8e;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--fons); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; font-size: 18px; }
  body { min-height: 100vh; }
  header { display: flex; align-items: center; justify-content: space-between; padding: 14px 24px;
    border-bottom: 1px solid var(--linia); position: sticky; top: 0; background: var(--fons); z-index: 5; }
  header img { height: 44px; }
  .passos { display: flex; gap: 8px; }
  .passos span { width: 34px; height: 6px; border-radius: 3px; background: var(--linia); }
  .passos span.fet { background: var(--blau); }
  main { max-width: 860px; margin: 0 auto; padding: 24px 20px 120px; }
  h1 { font-size: 30px; margin: 8px 0 6px; }
  h2 { font-size: 22px; margin: 28px 0 12px; color: var(--blau); }
  p.sub { color: var(--suau); margin: 0 0 20px; }
  .pantalla { display: none; }
  .pantalla.activa { display: block; }

  /* Inici */
  #inici { text-align: center; padding-top: 6vh; }
  #inici img { width: min(420px, 80%); margin-bottom: 30px; }
  .idiomes { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; max-width: 560px; margin: 30px auto 0; }
  .idiomes button { font-size: 22px; padding: 26px 10px; }

  /* Formulari */
  .graella { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 18px; }
  .ample { grid-column: 1 / -1; }
  label.camp { display: block; font-size: 15px; color: var(--suau); margin-bottom: 6px; }
  input[type=text], input[type=email], input[type=tel], select {
    width: 100%; font-size: 19px; padding: 14px 14px; border-radius: 10px; border: 1px solid var(--linia);
    background: var(--fons2); color: var(--text); outline: none; }
  input:focus, select:focus { border-color: var(--blau); }
  .data3 { display: grid; grid-template-columns: 1fr 1.6fr 1.2fr; gap: 8px; }
  .err { color: var(--error); font-size: 14px; min-height: 18px; margin-top: 4px; }
  .camp-err input, .camp-err select { border-color: var(--error); }
  .opcions { display: flex; gap: 10px; flex-wrap: wrap; }
  .opcio { flex: 1 1 200px; display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 10px;
    border: 1px solid var(--linia); background: var(--fons2); cursor: pointer; font-size: 17px; }
  .opcio input { width: 22px; height: 22px; accent-color: var(--blau); flex: none; }
  .opcio.triada { border-color: var(--blau); }
  .avis { background: #0f2c3f; border: 1px solid var(--blau2); border-radius: 12px; padding: 14px 16px; margin: 20px 0 6px; }

  /* Documents */
  .doc { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 18px 20px;
    border: 1px solid var(--linia); border-radius: 12px; background: var(--fons2); margin-bottom: 14px; }
  .doc .estat { font-size: 15px; color: var(--suau); margin-top: 4px; }
  .doc.llegit { border-color: var(--ok); }
  .doc.llegit .estat { color: var(--ok); }
  .check { display: flex; align-items: flex-start; gap: 12px; padding: 12px 0; font-size: 17px; }
  .check input { width: 24px; height: 24px; margin-top: 1px; accent-color: var(--blau); flex: none; }

  /* Lector */
  #lector { position: fixed; inset: 0; background: var(--fons); z-index: 20; display: none; flex-direction: column; }
  #lector.obert { display: flex; }
  #lector .cap { padding: 16px 22px; border-bottom: 1px solid var(--linia); font-size: 22px; font-weight: 600; }
  #lector .cos { flex: 1; overflow-y: auto; padding: 20px 26px 40px; line-height: 1.55; font-size: 17px; }
  #lector .cos h3 { color: var(--blau); font-size: 18px; margin: 22px 0 6px; }
  #lector .cos p { margin: 0 0 12px; white-space: pre-line; }
  #lector .peu { padding: 14px 22px; border-top: 1px solid var(--linia); display: flex; gap: 12px; align-items: center; justify-content: space-between; }
  #lector .peu .pista { color: var(--suau); font-size: 15px; }

  /* Signatura */
  .signatura { background: #fff; border-radius: 12px; position: relative; touch-action: none; }
  .signatura canvas { width: 100%; height: 220px; display: block; border-radius: 12px; }
  .signatura .linia { position: absolute; left: 24px; right: 24px; bottom: 50px; border-bottom: 2px dashed #b9c6d1; pointer-events: none; }
  .sig-cap { display: flex; justify-content: space-between; align-items: center; margin: 22px 0 8px; }
  .declaracio { color: var(--suau); font-size: 16px; margin-top: 18px; }

  /* Botons */
  button { font: inherit; border: 0; border-radius: 12px; padding: 16px 26px; cursor: pointer; font-weight: 600;
    background: var(--blau); color: #fff; }
  button:disabled { background: var(--linia); color: var(--suau); cursor: default; }
  button.sec { background: transparent; color: var(--text); border: 1px solid var(--linia); }
  button.petit { padding: 8px 14px; font-size: 15px; }
  .barra { position: fixed; left: 0; right: 0; bottom: 0; background: var(--fons); border-top: 1px solid var(--linia);
    padding: 14px 20px; display: flex; justify-content: space-between; gap: 12px; z-index: 6; }
  .barra .dreta { display: flex; gap: 12px; }

  /* Final */
  #final, #enviant { text-align: center; padding-top: 14vh; }
  .icona { font-size: 80px; line-height: 1; }
  #final h1 { margin-top: 18px; }

  @media (max-width: 640px) {
    .graella { grid-template-columns: 1fr; }
    header img { height: 34px; }
    h1 { font-size: 25px; }
  }
</style>

<header id="capcalera" style="display:none">
  <img id="logoCap" alt="Circuit Andorra">
  <div class="passos"><span id="p1"></span><span id="p2"></span><span id="p3"></span></div>
</header>

<main>
  <!-- 0. Inici -->
  <section id="inici" class="pantalla activa">

      <button data-idioma="es">Castellano</button>
      <button data-idioma="fr">Français</button>
      <button data-idioma="en">English</button>
    </div>
  </section>

  <!-- 1. Dades -->
  <section id="dades" class="pantalla">
    <h1 data-t="titDades"></h1>
    <p class="sub" data-t="subDades"></p>
    <div class="graella">
      <div class="ample"><label class="camp" data-t="activitat"></label><select id="activitat"></select><div class="err"></div></div>
      <div class="ample">

        <div class="opcions">
          <label class="opcio"><input type="radio" name="rol" value="Pilot"><span data-t="pilot"></span></label>
          <label class="opcio"><input type="radio" name="rol" value="Copilot"><span data-t="copilot"></span></label>
        </div>
        <div class="err" id="errRol"></div>
      </div>
      <div><label class="camp" data-t="nom"></label><input type="text" id="nom" autocomplete="off" autocapitalize="words"><div class="err"></div></div>
      <div><label class="camp" data-t="cognoms"></label><input type="text" id="cognoms" autocomplete="off" autocapitalize="words"><div class="err"></div></div>
      <div><label class="camp" data-t="document"></label><input type="text" id="document" autocomplete="off" autocapitalize="characters"><div class="err"></div></div>
      <div><label class="camp" data-t="nacionalitat"></label><input type="text" id="nacionalitat" autocomplete="off" autocapitalize="words"><div class="err"></div></div>
      <div class="ample">
        <label class="camp" data-t="naixement"></label>
        <div class="data3"><select id="dia"></select><select id="mes"></select><select id="any"></select></div>

  </section>

/* ---------- Edat i tutor ---------- */
function dataNaixement() {
  var d = +$("dia").value, m = +$("mes").value, y = +$("any").value;
  if (!d || !m || !y) return null;
  var dt = new Date(y, m - 1, d);
  if (dt.getMonth() !== m - 1) return false;
  return dt;
}
function edat(dt) {
  var avui = new Date();
  var e = avui.getFullYear() - dt.getFullYear();
  var mm = avui.getMonth() - dt.getMonth();
  if (mm < 0 || (mm === 0 && avui.getDate() < dt.getDate())) e--;
  return e;
}
function esMenor() {
  var dt = dataNaixement();
  return !!(dt && edat(dt) < 18);
}
["dia", "mes", "any"].forEach(function (id) {
  $(id).addEventListener("change", function () {
    $("blocTutor").style.display = esMenor() ? "block" : "none";

document.querySelectorAll("input[name=asseg]").forEach(function (r) {

document.addEventListener("change", function (e) {

      r.closest(".opcio").classList.toggle("triada", r.checked);

});

/* ---------- Validació ---------- */
function valorRadio(nom) {
  var r = document.querySelector("input[name='" + nom + "']:checked");
  return r ? r.value : "";
}
function errCamp(id, msg) {
  var el = $(id), cont = el.parentElement;
  cont.classList.toggle("camp-err", !!msg);
  cont.querySelector(".err").textContent = msg || "";
  return !msg;
}
function requerit(id) { return errCamp(id, $(id).value.trim() ? "" : t("obligatori")); }

function valida1() {
  var ok = true;
  ok = errCamp("activitat", $("activitat").value ? "" : t("triaUna")) && ok;
  var rol = valorRadio("rol");
  $("errRol").textContent = rol ? "" : t("triaUna"); ok = !!rol && ok;
  ["nom", "cognoms", "document", "nacionalitat", "mobil"].forEach(function (id) { ok = requerit(id) && ok; });
  var em = $("email").value.trim();
  ok = errCamp("email", !em ? t("obligatori") : (/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(em) ? "" : t("emailMal"))) && ok;
  var dt = dataNaixement();
  $("errNaix").textContent = dt === null ? t("obligatori") : (dt === false ? t("dataMal") : "");
  ok = !!dt && ok;
  if (valorRadio("asseg") === "propia") ok = requerit("llicencia") && ok;
  if (dt && edat(dt) < 18) {
    var rel = valorRadio("relacio");
    $("errRelacio").textContent = rel ? "" : t("triaUna"); ok = !!rel && ok;
    ["tutorNom", "tutorCognoms", "tutorDocument", "tutorMobil"].forEach(function (id) { ok = requerit(id) && ok; });
  }
  if (!ok) { var e = document.querySelector(".camp-err, .err:not(:empty)"); if (e) e.scrollIntoView({ block: "center", behavior: "smooth" }); }
  return ok;
}
function valida2() {
  var ok = estat.llegit.condicions && estat.llegit.descarrec;
  $("errDocs").textContent = ok ? "" : t("llegeixDocs");
  var im = valorRadio("imatge");
  $("errImatge").textContent = im ? "" : t("triaUna");
  return ok && !!im;
}
function valida3() {
  var ok = true;
  $("errSigPilot").textContent = sig.sigPilot.buida ? t("signaFalta") : "";
  ok = !sig.sigPilot.buida;
  if (esMenor()) {
    $("errSigTutor").textContent = sig.sigTutor.buida ? t("signaFalta") : "";
    ok = !sig.sigTutor.buida && ok;
  }
  return ok;
}

/* ---------- Documents i lector ---------- */
var docObert = null;
document.querySelectorAll("[data-obre]").forEach(function (b) {
  b.addEventListener("click", function () { obreDoc(b.getAttribute("data-obre")); });
});

function htmlEscapa(s) { return s.replace(/[&<>"]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]; }); }

function obreDoc(qual) {
  docObert = qual;
  var tx = TEXTOS[idioma][qual], h = "";
  if (qual === "condicions") {
    tx.seccions.forEach(function (s) { h += "<h3>" + htmlEscapa(s[0]) + "</h3><p>" + htmlEscapa(s[1]) + "</p>"; });
  } else {
    tx.clausules.forEach(function (c) { h += "<p>" + htmlEscapa(c) + "</p>"; });
    h += "<p><strong>" + htmlEscapa(tx.final) + "</strong></p>";
  }
  h += "<p style='color:var(--suau);font-size:14px;margin-top:30px'>" + htmlEscapa(EMPRESA) + "<br>" + VERSIO_DOCS + "</p>";
  $("lectorTitol").textContent = tx.titol;
  $("lectorCos").innerHTML = h;
  $("lectorCos").scrollTop = 0;
  $("lector").classList.add("obert");
  $("lectorAccepto").disabled = !estat.llegit[qual];
  $("lectorPista").textContent = estat.llegit[qual] ? t("pistaOk") : t("pistaBaixa");
  setTimeout(comprovaFinal, 50);
}
function comprovaFinal() {

$("lectorCos").addEventListener("scroll", function () { comprovaFinal(); reiniciaTemporitzador(); });
$("lectorTancar").addEventListener("click", function () { $("lector").classList.remove("obert"); });
$("lectorAccepto").addEventListener("click", function () {
  estat.llegit[docObert] = true;
  estat.llegit[docObert + "Hora"] = new Date().toISOString();
  $("lector").classList.remove("obert");
  actualitzaDocs();
});
function actualitzaDocs() {
  if (!estat) return;
  [["condicions", "docCondicions"], ["descarrec", "docDescarrec"]].forEach(function (p) {
    var el = $(p[1]);
    el.classList.toggle("llegit", estat.llegit[p[0]]);
    el.querySelector(".estat").textContent = estat.llegit[p[0]] ? t("llegit") : t("pendent");
  });
  if (estat.llegit.condicions && estat.llegit.descarrec) $("errDocs").textContent = "";
}

/* ---------- Signatures ---------- */
var sig = {};
function creaSignatura(id) {
  var c = $(id), ctx = c.getContext("2d"), s = { canvas: c, buida: true };
  function mida() {
    var r = c.getBoundingClientRect(), dpr = window.devicePixelRatio || 1;
    if (!r.width) return;
    var dades = s.buida ? null : c.toDataURL();
    c.width = r.width * dpr; c.height = r.height * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.lineWidth = 2.6; ctx.lineCap = "round"; ctx.lineJoin = "round"; ctx.strokeStyle = "#0b1620";
    if (dades) { var im = new Image(); im.onload = function () { ctx.drawImage(im, 0, 0, r.width, r.height); }; im.src = dades; }
  }
  var dibuixant = false, ultim = null;
  function pos(e) { var r = c.getBoundingClientRect(); return { x: e.clientX - r.left, y: e.clientY - r.top }; }
  c.addEventListener("pointerdown", function (e) { e.preventDefault(); c.setPointerCapture(e.pointerId); dibuixant = true; ultim = pos(e);
    ctx.beginPath(); ctx.arc(ultim.x, ultim.y, 1.3, 0, Math.PI * 2); ctx.fillStyle = "#0b1620"; ctx.fill(); s.buida = false; reiniciaTemporitzador(); });
  c.addEventListener("pointermove", function (e) { if (!dibuixant) return; e.preventDefault(); var p = pos(e);
    ctx.beginPath(); ctx.moveTo(ultim.x, ultim.y); ctx.lineTo(p.x, p.y); ctx.stroke(); ultim = p; s.buida = false; });
  ["pointerup", "pointercancel", "pointerleave"].forEach(function (ev) { c.addEventListener(ev, function () { dibuixant = false; }); });
  s.mida = mida;
  s.esborra = function () { ctx.save(); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, c.width, c.height); ctx.restore(); s.buida = true; };
  return s;
}
sig.sigPilot = creaSignatura("sigPilot");
sig.sigTutor = creaSignatura("sigTutor");
document.querySelectorAll("[data-esborra]").forEach(function (b) {
  b.addEventListener("click", function () { sig[b.getAttribute("data-esborra")].esborra(); });
});
function prepararSignatures() {
  var menor = esMenor();
  $("blocSigTutor").style.display = menor ? "block" : "none";
  $("nomSigPilot").textContent = t("signaPilot") + ": " + $("nom").value.trim() + " " + $("cognoms").value.trim();
  $("nomSigTutor").textContent = t("signaTutor") + ": " + $("tutorNom").value.trim() + " " + $("tutorCognoms").value.trim();
  setTimeout(function () { sig.sigPilot.mida(); if (menor) sig.sigTutor.mida(); }, 30);
}
window.addEventListener("resize", function () { if (pas === 3) { sig.sigPilot.mida(); sig.sigTutor.mida(); } });

/* ---------- Dades i PDF ---------- */
function dues(n) { return (n < 10 ? "0" : "") + n; }
function recullDades() {
  var dt = dataNaixement(), ara = new Date(), menor = esMenor();
  var id = "CA-" + ara.getFullYear() + dues(ara.getMonth() + 1) + dues(ara.getDate()) + "-" +
    dues(ara.getHours()) + dues(ara.getMinutes()) + dues(ara.getSeconds()) + "-" + Math.random().toString(36).slice(2, 6).toUpperCase();
  var act = $("activitat").value;
  return {
    id: id, idioma: idioma, activitat: act === "__altres" ? t("altres") : act, rol: valorRadio("rol"),
    nom: $("nom").value.trim(), cognoms: $("cognoms").value.trim(), document: $("document").value.trim().toUpperCase(),
    naixement: dues(dt.getDate()) + "/" + dues(dt.getMonth() + 1) + "/" + dt.getFullYear(), edat: edat(dt),
    nacionalitat: $("nacionalitat").value.trim(), email: $("email").value.trim().toLowerCase(), mobil: $("mobil").value.trim(),
    instagram: $("instagram").value.trim(),
    asseguranca: valorRadio("asseg") === "propia" ? "Pròpia / llicència" : "Circuit", llicencia: valorRadio("asseg") === "propia" ? $("llicencia").value.trim() : "",
    menor: menor,
    tutorNom: menor ? $("tutorNom").value.trim() : "", tutorCognoms: menor ? $("tutorCognoms").value.trim() : "",
    tutorDocument: menor ? $("tutorDocument").value.trim().toUpperCase() : "", tutorMobil: menor ? $("tutorMobil").value.trim() : "",
    tutorRelacio: menor ? valorRadio("relacio") : "",
    acceptaCondicions: estat.llegit.condicions, acceptaDescarrec: estat.llegit.descarrec,
    imatge: valorRadio("imatge") === "si", newsletter: $("newsletter").checked,
    versio: VERSIO_DOCS, dataHora: ara.toLocaleString(idioma === "en" ? "en-GB" : idioma)
  };
}

function creaPdf(d) {
  var jsPDF = window.jspdf.jsPDF;
  var doc = new jsPDF({ unit: "mm", format: "a4", compress: true });
  var M = 15, W = 210 - 2 * M, y = 0;
  var tx = TEXTOS[idioma];

  function capcalera() {
    doc.setFillColor(11, 22, 32); doc.rect(0, 0, 210, 24, "F");
    try { doc.addImage(LOGO, "PNG", M, 4, 40, 16, "logo", "FAST"); } catch (e) {}
    doc.setTextColor(255, 255, 255); doc.setFont("helvetica", "bold"); doc.setFontSize(11);
    doc.text(t("pdfTitol"), 210 - M, 11, { align: "right" });
    doc.setFont("helvetica", "normal"); doc.setFontSize(8.5);
    doc.text(d.id, 210 - M, 17, { align: "right" });
    doc.setTextColor(20, 20, 20);
    y = 32;
  }
  function espai(h) { if (y + h > 297 - 16) { doc.addPage(); capcalera(); } }
  function titol(s) { espai(12); doc.setFont("helvetica", "bold"); doc.setFontSize(12); doc.setTextColor(0, 134, 192); doc.text(s, M, y); y += 6; doc.setTextColor(20, 20, 20); }
  function paragraf(s, mida, negreta) {
    doc.setFont("helvetica", negreta ? "bold" : "normal"); doc.setFontSize(mida || 8.5);
    var linies = doc.splitTextToSize(s, W), alt = (mida || 8.5) * 0.42;
    linies.forEach(function (l) { espai(alt); doc.text(l, M, y); y += alt; });
    y += 1.6;
  }
  function fila(et, val) {
    espai(10); doc.setFont("helvetica", "bold"); doc.setFontSize(9);
    var le = doc.splitTextToSize(et, 52); doc.text(le, M, y);
    doc.setFont("helvetica", "normal");
    var ll = doc.splitTextToSize(String(val || "—"), W - 55); doc.text(ll, M + 55, y); y += Math.max(5, Math.max(ll.length, le.length) * 4.2);
  }

  capcalera();
  titol(t("pdfDades"));
  fila(t("activitat"), d.activitat); fila(t("rol").replace("…", ""), d.rol === "Pilot" ? t("pilot") : t("copilot"));
  fila(t("nom"), d.nom); fila(t("cognoms"), d.cognoms); fila(t("document"), d.document);
  fila(t("naixement"), d.naixement + "  (" + d.edat + ")"); fila(t("nacionalitat"), d.nacionalitat);
  fila(t("email"), d.email); fila(t("mobil"), d.mobil); if (d.instagram) fila("Instagram", d.instagram);
  fila(t("asseguranca"), d.asseguranca === "Circuit" ? t("assegCircuit") : t("assegPropia") + (d.llicencia ? " — " + d.llicencia : ""));
  if (d.menor) {
    y += 2; titol(t("pdfTutor"));
    fila(t("relacio"), d.tutorRelacio === "Pare" ? t("pare") : d.tutorRelacio === "Mare" ? t("mare") : t("tutorLegal"));
    fila(t("nom"), d.tutorNom); fila(t("cognoms"), d.tutorCognoms); fila(t("document"), d.tutorDocument); fila(t("mobil"), d.tutorMobil);
  }
  y += 2; titol(t("pdfAcceptacions"));
  fila(tx.condicions.titol, t("pdfSi") + " · " + new Date(estat.llegit.condicionsHora).toLocaleString(idioma === "en" ? "en-GB" : idioma));
  fila(tx.descarrec.titol, t("pdfSi") + " · " + new Date(estat.llegit.descarrecHora).toLocaleString(idioma === "en" ? "en-GB" : idioma));
  fila(t("titImatge"), d.imatge ? t("imatgeSi") : t("imatgeNo"));
  fila("Newsletter", d.newsletter ? t("pdfSi") : t("pdfNo"));
  fila(t("pdfData"), d.dataHora + " · " + t("pdfLloc"));

  // Signatures
  y += 3; titol(t("titSignar"));
  paragraf(t("declaracio"), 8.5);
  var amplada = d.menor ? (W - 8) / 2 : W / 2, alt = 32;
  espai(alt + 12);
  doc.setDrawColor(200, 208, 215);
  doc.rect(M, y, amplada, alt);
  doc.addImage(signaturaJpg(sig.sigPilot.canvas), "JPEG", M + 1, y + 1, amplada - 2, alt - 2);
  doc.setFontSize(8); doc.setFont("helvetica", "normal");
  doc.text(t("signaPilot") + ": " + d.nom + " " + d.cognoms, M, y + alt + 4.5);
  if (d.menor) {
    var x2 = M + amplada + 8;
    doc.rect(x2, y, amplada, alt);
    doc.addImage(signaturaJpg(sig.sigTutor.canvas), "JPEG", x2 + 1, y + 1, amplada - 2, alt - 2);
    doc.text(t("signaTutor") + ": " + d.tutorNom + " " + d.tutorCognoms, x2, y + alt + 4.5);
  }
  y += alt + 12;

  // Documents complets
  doc.addPage(); capcalera();
  titol(tx.descarrec.titol);
  tx.descarrec.clausules.forEach(function (c) { paragraf(c, 8.2); });
  paragraf(tx.descarrec.final, 8.5, true);
  y += 3; titol(tx.condicions.titol);
  tx.condicions.seccions.forEach(function (s) { paragraf(s[0], 8.8, true); y -= 1.2; paragraf(s[1], 8.2); });
  paragraf(VERSIO_DOCS, 7.5);

  // Peu de pàgina
  var n = doc.getNumberOfPages();
  for (var i = 1; i <= n; i++) {
    doc.setPage(i); doc.setFontSize(7); doc.setTextColor(120, 130, 140);
    doc.text(EMPRESA, M, 297 - 8, { maxWidth: W - 25 });
    doc.text(t("pdfPagina") + " " + i + "/" + n, 210 - M, 297 - 8, { align: "right" });
  }
  return doc;
}

// Signatura reduïda, fons blanc i JPEG: el PDF pesa molt menys.
function signaturaJpg(c) {
  var w = 900, h = Math.round(w * c.height / c.width);
  var t2 = document.createElement("canvas"); t2.width = w; t2.height = h;
  var x = t2.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(c, 0, 0, w, h);
  return t2.toDataURL("image/jpeg", 0.8);
}

function nomFitxer(d) {
  var net = function (s) { return s.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_|_$/g, ""); };
  return d.id.slice(3, 18).replace("-", "_") + "_" + net(d.cognoms).toUpperCase() + "_" + net(d.nom) + ".pdf";
}

/* ---------- Enviament ---------- */
function enviar() {
  var d = recullDades();
  var doc = creaPdf(d);
  pendent = { clau: CLAU, dades: d, pdf: doc.output("datauristring").split(",")[1], nomFitxer: nomFitxer(d) };
  if (!window.ENDPOINT && (!window.google || !google.script)) pendent.docLocal = doc; // proves fora de Google
  envia();
}
function envia() {
  mostraEspecial("enviant");
  if (window.ENDPOINT) {
    // Versió pública (QR): envia a Google sense cap compte obert, així no hi ha conflictes de comptes.
    fetch(ENDPOINT, { method: "POST", body: JSON.stringify(pendent), credentials: "omit", redirect: "follow",
      headers: { "Content-Type": "text/plain;charset=utf-8" } })
      .then(function (r) { return r.json(); })
      .then(function (r) { if (r && r.ok) fet(r); else error(); })
      .catch(error);
  } else if (window.google && google.script && google.script.run) {
    google.script.run.withSuccessHandler(fet).withFailureHandler(error).guardar(pendent);
  } else {
    // Mode de prova (fora de Google): descarrega el PDF i mostra les dades a la consola.
    console.log("PROVA · dades:", pendent.dades);
    window.__ultimaInscripcio = pendent;
    try { pendent.docLocal.save(pendent.nomFitxer); } catch (e) {}
    setTimeout(function () { fet({ ok: true, id: pendent.dades.id, prova: true }); }, 400);
  }
}
function fet() {
  pendent = null;
  acabat = true;
  mostraEspecial("final");
  $("iconaFinal").textContent = "✅";
  $("titFinal").textContent = t("gracies");
  $("textFinal").textContent = t("graciesText");
  $("botonsError").style.display = "none";
  clearTimeout(temporitzador);
  temporitzador = setTimeout(reinicia, 10000);
}
function error() {
  mostraEspecial("final");
  $("iconaFinal").textContent = "⚠️";
  $("titFinal").textContent = t("errTitol");
  $("textFinal").textContent = t("errText");
  $("botonsError").style.display = "flex";
  clearTimeout(temporitzador);
}
$("reintentar").addEventListener("click", function () { if (pendent) envia(); });

/* ---------- Reinici (privacitat entre participants) ---------- */
function reinicia() {
  clearTimeout(temporitzador);
  acabat = false;
  estat = estatNou();
  pendent = null;
  document.querySelectorAll("input[type=text], input[type=email], input[type=tel]").forEach(function (i) { i.value = ""; });
  document.querySelectorAll("input[type=radio]").forEach(function (r) { r.checked = r.name === "asseg" && r.value === "circuit"; });
  document.querySelectorAll(".opcio").forEach(function (o) { o.classList.toggle("triada", !!o.querySelector("input:checked")); });
  $("newsletter").checked = false;
  document.querySelectorAll("select").forEach(function (s) { s.value = ""; });
  document.querySelectorAll(".err").forEach(function (e) { e.textContent = ""; });
  document.querySelectorAll(".camp-err").forEach(function (e) { e.classList.remove("camp-err"); });
  $("blocTutor").style.display = "none"; $("blocLlicencia").style.display = "none";
  $("lector").classList.remove("obert");
  sig.sigPilot.esborra(); sig.sigTutor.esborra();
  actualitzaDocs();
  mostra(0);
}
// Si la tauleta es queda 5 minuts sense tocar a mig formulari, torna a l'inici i ho esborra.
var acabat = false;
function reiniciaTemporitzador() {
  clearTimeout(temporitzador);
  if (acabat) temporitzador = setTimeout(reinicia, 10000);
  else if (pas > 0) temporitzador = setTimeout(reinicia, 5 * 60 * 1000);
}
document.addEventListener("pointerdown", reiniciaTemporitzador);
document.addEventListener("keydown", reiniciaTemporitzador);

$("logoCap").src = LOGO; $("logoInici").src = LOGO;
estat = estatNou();
</script>
